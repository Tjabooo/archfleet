# clipdeck for a classic hyprland.conf. SUPER+V opens it; each entry's key copies it here;
# Esc, Enter, SUPER+V or any other key closes it.
bind = SUPER, V, exec, ~/.local/bin/clipdeck show

submap = clip
bind = , 1, exec, ~/.local/bin/clipdeck pick 1
bind = , 2, exec, ~/.local/bin/clipdeck pick 2
bind = , 3, exec, ~/.local/bin/clipdeck pick 3
bind = , 4, exec, ~/.local/bin/clipdeck pick 4
bind = , 5, exec, ~/.local/bin/clipdeck pick 5
bind = , 6, exec, ~/.local/bin/clipdeck pick 6
bind = , 7, exec, ~/.local/bin/clipdeck pick 7
bind = , 8, exec, ~/.local/bin/clipdeck pick 8
bind = , 9, exec, ~/.local/bin/clipdeck pick 9
bind = , 0, exec, ~/.local/bin/clipdeck pick 0
bind = , Q, exec, ~/.local/bin/clipdeck pick Q
bind = , W, exec, ~/.local/bin/clipdeck pick W
bind = , E, exec, ~/.local/bin/clipdeck pick E
bind = , R, exec, ~/.local/bin/clipdeck pick R
bind = , T, exec, ~/.local/bin/clipdeck pick T
bind = , Y, exec, ~/.local/bin/clipdeck pick Y
bind = , U, exec, ~/.local/bin/clipdeck pick U
bind = , I, exec, ~/.local/bin/clipdeck pick I
bind = , O, exec, ~/.local/bin/clipdeck pick O
bind = , P, exec, ~/.local/bin/clipdeck pick P
bind = , A, exec, ~/.local/bin/clipdeck pick A
bind = , S, exec, ~/.local/bin/clipdeck pick S
bind = , D, exec, ~/.local/bin/clipdeck pick D
bind = , F, exec, ~/.local/bin/clipdeck pick F
bind = , G, exec, ~/.local/bin/clipdeck pick G
bind = , H, exec, ~/.local/bin/clipdeck pick H
bind = , J, exec, ~/.local/bin/clipdeck pick J
bind = , K, exec, ~/.local/bin/clipdeck pick K
bind = , L, exec, ~/.local/bin/clipdeck pick L
bind = , escape, exec, ~/.local/bin/clipdeck hide
bind = , return, exec, ~/.local/bin/clipdeck hide
bind = SUPER, V, exec, ~/.local/bin/clipdeck hide
bind = , catchall, exec, ~/.local/bin/clipdeck hide
submap = reset
