[package]
name = "archfleet"
version = "0.2.2"
edition = "2024"
description = "Terminal dashboard for the machines in your home, over plain SSH"
license = "MIT"
repository = "https://github.com/Tjabooo/archfleet"
rust-version = "1.88"

[dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
wait-timeout = "0.2"
ureq = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
